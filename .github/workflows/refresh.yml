name: Refresh dashboard data

# Regenerates from the SHARED module drsoam.py (app-builder): data.json, a daily
# history snapshot, changes.json and feed.xml.
#
# BILLING_TOKEN (optional): a classic PAT with the 'user' scope, so the Actions
# budget panel can show live minutes. Without it the panel explains the rule.
#
# FIXED: the commit step named all seven generated files on one `git add` line.
# `git add` exits non-zero when ANY named path does not exist, and Actions runs
# bash with -e, so a single missing or renamed output file failed the whole
# refresh - silently, from the dashboard's point of view. It now adds only the
# files that are actually there, and reports what it is committing.

on:
  schedule:
    - cron: "47 3 * * 2"   # weekly, Tuesday 03:47 UTC
  push:
    branches: [ main ]
    paths:
      - .github/workflows/refresh.yml
      - index.html
      - repo.html
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  # false: a refresh takes ~80s and was being cancelled by its own next trigger,
  # on top of losing the push race. It should finish.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate
        env:
          # FANOUT_TOKEN FIRST. `github.token` is scoped to THIS repository, so drsoam's
          # /user/repos call returns one repository and the tool correctly reports
          # `scope: public-only` - the estate's private repositories are invisible. With a
          # cross-repository read token the same code returns all 83 and says `scope: all`.
          # Falls back to github.token when the secret is absent, so this changes nothing
          # until the secret is set.
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN || github.token }}
          BILLING_TOKEN: ${{ secrets.BILLING_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 .drsoam/drsoam.py dashboard
      - name: Publish the data where the page reads it
        run: |
          # THE CONSOLE HAS BEEN LOADING NOTHING.
          #
          # The page is docs/play/index.html and it fetches its data RELATIVELY -
          # fetch("data.json"), fetch("runs.json"), fetch("SPEC-GAP.json") - so on the
          # published site every one of those resolves to /dashboard/play/<file>. The
          # refresh writes them to the REPOSITORY ROOT, and Pages serves only /docs, so
          # each fetch has been a 404: the live console renders its empty state and
          # reports nothing. The same is true of the footer's changes.json and feed.xml
          # links.
          #
          # Copy the data to where the page looks. The root copies stay: the registry
          # and the hub read them through raw.githubusercontent.
          set -euo pipefail
          for f in data.json changes.json runs.json SPEC-GAP.json feed.xml \
                   history.json forks.json community.json traffic.json; do
            [ -f "$f" ] && cp "$f" "docs/play/$f"
          done
          # A new path the manifest does not know is refused by the gate on the next run,
          # so record what was just published, with the producer that wrote it.
          python3 tools/manifest.py record \
            docs/play/data.json docs/play/changes.json docs/play/runs.json \
            docs/play/SPEC-GAP.json docs/play/feed.xml docs/play/history.json \
            docs/play/forks.json docs/play/community.json docs/play/traffic.json \
            --producer "refresh.yml@$(git rev-parse --short HEAD)" || true

      - name: Commit if changed
        run: |
          # F-97: the verdict is "did data.json land on the branch", not "did git exit 0".
          # This step used to fail after the data had already landed, twice - the push
          # race - and the run read as a failure while the estate was correctly updated.
          # tools/commit-and-verify.sh records each file's blob sha, commits, pushes with
          # backoff, then fetches the branch and compares. Equality is success.
          #
          # The old note here blamed a "health workflow ... every few minutes". That
          # workflow does not exist in this repository - its only workflows are
          # refresh.yml and test.yml - so the blamed party was fiction and sent readers
          # looking for it. The race is real: this workflow fires on push to main AND on
          # dispatch, and cancel-in-progress: false queues rather than cancels, so two
          # runs can reach this step together.
          # docs/play/ is where the page actually reads them; both sets are committed so
          # the root copies (registry, hub) and the served copies cannot drift apart.
          bash tools/commit-and-verify.sh "chore: refresh dashboard data [skip ci]" main -- \
            data.json history.json changes.json feed.xml forks.json community.json traffic.json \
            docs/play/data.json docs/play/history.json docs/play/changes.json \
            docs/play/feed.xml docs/play/forks.json docs/play/community.json \
            docs/play/traffic.json docs/play/runs.json docs/play/SPEC-GAP.json
