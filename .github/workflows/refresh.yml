# Refresh the dashboard data on a schedule.
#
# The dashboard is a static page; this regenerates data.json from the public
# repo list and commits it, so the page stays current with no server and no PAT.
# Commits carry [skip ci] so this workflow never re-triggers itself.

name: Refresh dashboard data

on:
  schedule:
    - cron: "47 3 * * *"   # daily, 03:47 UTC (offset from hub 03:17 and metrics 04:00)
  push:
    branches: [ main ]
    paths: [ refresh.py ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate data.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 refresh.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git commit -m "chore: refresh dashboard data [skip ci]"
          git push
