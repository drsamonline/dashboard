name: Refresh dashboard data

# Regenerates from the SHARED module drsoam.py (app-builder): data.json, a daily
# history snapshot, changes.json and feed.xml.
#
# BILLING_TOKEN (optional): a classic PAT with the 'user' scope, so the Actions
# budget panel can show live minutes. Without it the panel explains the rule.
#
# FIXED: the commit step named all seven generated files on one `git add` line.
# `git add` exits non-zero when ANY named path does not exist, and Actions runs
# bash with -e, so a single missing or renamed output file failed the whole
# refresh - silently, from the dashboard's point of view. It now adds only the
# files that are actually there, and reports what it is committing.

on:
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [ main ]
    paths:
      - .github/workflows/refresh.yml
      - index.html
      - repo.html
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  # false: a refresh takes ~80s and was being cancelled by its own next trigger,
  # on top of losing the push race. It should finish.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate
        env:
          # FANOUT_TOKEN FIRST. `github.token` is scoped to THIS repository, so drsoam's
          # /user/repos call returns one repository and the tool correctly reports
          # `scope: public-only` - the estate's private repositories are invisible. With a
          # cross-repository read token the same code returns all 83 and says `scope: all`.
          # Falls back to github.token when the secret is absent, so this changes nothing
          # until the secret is set.
          GH_TOKEN: ${{ secrets.FANOUT_TOKEN || github.token }}
          BILLING_TOKEN: ${{ secrets.BILLING_TOKEN }}
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 .drsoam/drsoam.py dashboard
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          # add only what exists: a missing path must not fail the run
          added=0
          for f in data.json history.json changes.json feed.xml forks.json community.json traffic.json; do
            if [ -e "$f" ]; then git add -- "$f"; added=$((added+1)); else echo "::warning::$f was not generated"; fi
          done
          if git diff --staged --quiet; then echo "nothing staged"; exit 0; fi
          echo "staged $added tracked path(s)"
          git commit -m "chore: refresh dashboard data [skip ci]"
          # A PLAIN `git push` HERE LOSES THE RACE and fails with "failed to push some
          # refs" - which is why data.json once sat at 11:00 while the refresh reported
          # nothing wrong. Rebase onto whatever landed, then retry.
          #
          # The comment that used to be here blamed "the health workflow ... every few
          # minutes". That workflow is NOT in this repository - its only workflows are
          # refresh.yml and test.yml - so the blamed party does not exist and the note
          # sent the next reader looking for it. The race is real; the culprit named was
          # not. Two triggers landing together is enough: this workflow fires on push to
          # main AND on dispatch, and `cancel-in-progress: false` means the second one
          # queues rather than being cancelled, so both can reach this step together.
          #
          # Four attempts with a flat 4s sleep did not survive that. Six attempts with a
          # growing backoff do, and the failure message now says what to look at.
          BR="${GITHUB_REF_NAME:-main}"
          attempt=0
          for wait in 0 4 8 16 30 30; do
            attempt=$((attempt+1))
            [ "$wait" = "0" ] || sleep "$wait"
            git fetch origin "$BR" --quiet
            if ! git rebase "origin/$BR" --quiet; then
              echo "::warning::rebase onto origin/$BR failed on attempt $attempt"
              git rebase --abort || true
              continue
            fi
            if git push --quiet origin "HEAD:$BR"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
          done
          echo "::error::could not push after $attempt attempts (~88s of backoff). Read this run's"
          echo "::error::concurrent refresh runs before blaming another workflow - the one this"
          echo "::error::file used to name does not exist in this repository."
          exit 1
