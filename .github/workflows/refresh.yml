name: Refresh dashboard data

# Regenerates from the SHARED module drsoam.py (app-builder). Also records a daily
# history snapshot, so the console can show change over time.

on:
  schedule:
    - cron: "47 3 * * *"
  push:
    branches: [ main ]
    paths:
      - .github/workflows/refresh.yml
      - index.html
      - repo.html
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: drsamonline/app-builder
          path: .drsoam
      - name: Regenerate data.json + history.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .drsoam/drsoam.py dashboard
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json history.json
          git commit -m "chore: refresh dashboard data [skip ci]"
          git push
