name: test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # was @v4
        with:
          node-version: "20"
      # No package-lock.json is committed, so `npm ci` always failed with a
      # wall of EUSAGE text before falling through to `npm install`. That noise
      # is what hid the real failure (ENOENT on a page the audit had deleted).
      - run: npm install --no-audit --no-fund
      - run: node tests/structure.test.js
